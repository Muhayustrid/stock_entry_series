[project]
name = "stock_entry_series"
authors = [
    { name = "Muhammad Yusuf Tri Daryanto", email = "114971841+Muhayustrid@users.noreply.github.com"}
]
description = "Automatically select Stock Entry naming series based on Stock Entry Type in ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

# Rentang versi framework yang didukung app — dipakai Frappe Cloud untuk
# mencocokkan app dengan bench (dibangun & diuji di frappe/erpnext v16).
[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
